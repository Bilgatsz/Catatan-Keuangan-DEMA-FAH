<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas BEM FAH - Kabinet Senapati</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS untuk Ekspor Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { 
      -webkit-overflow-scrolling: touch; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    /* Watermark Latar Belakang */
    .watermark-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .watermark-img {
      width: 45%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
    }

    /* Keyframes Animasi Modal Pop-up */
    @keyframes modalSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-modal {
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Keyframes Animasi Masuk Kartu Transaksi */
    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-card {
      animation: cardFadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 text-gray-800 pb-12 min-h-screen relative overflow-x-hidden">

  <!-- Watermark Latar Belakang (Logo DEMA-F & Logo Senapati) -->
  <div class="watermark-container">
    <img src="logo dema.jpeg" alt="Logo DEMA" class="watermark-img">
    <img src="LOGO SENAPATI BIRU.jpg" alt="Logo Senapati" class="watermark-img">
  </div>

  <!-- Header -->
  <header class="bg-blue-900/90 backdrop-blur-md text-white p-3.5 shadow-lg sticky top-0 z-20 border-b border-blue-700/50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <!-- Kombinasi Dua Logo di Header -->
        <div class="flex items-center gap-1.5 bg-white/10 px-2 py-1 rounded-xl backdrop-blur-md border border-white/20 shadow-inner">
          <img src="logo dema.jpeg" alt="Logo DEMA" class="h-8 w-auto object-contain">
          <span class="text-white/30 text-xs">|</span>
          <img src="LOGO SENAPATI BIRU.jpg" alt="Logo Senapati" class="h-8 w-auto object-contain">
        </div>
        <div>
          <h1 class="text-xs font-black tracking-wide leading-tight">Kas BEM FAH</h1>
          <p class="text-[10px] text-blue-200 font-semibold tracking-wider uppercase">Kabinet Senapati</p>
        </div>
      </div>
      
      <button onclick="exportToExcel()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-[11px] px-3 py-1.5 rounded-xl font-bold shadow-md transition-all duration-150 flex items-center gap-1">
        <span>📊</span>
        <span>Ekspor</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4 relative z-10">

    <!-- Ringkasan Saldo -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-white/80 backdrop-blur-md p-3.5 rounded-2xl shadow-sm border border-white/60 hover:shadow-md transition">
        <div class="flex items-center gap-1.5 mb-1">
          <span class="text-xs">💰</span>
          <p class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Masuk</p>
        </div>
        <p id="totalMasuk" class="text-base font-black text-emerald-600">Rp 0</p>
      </div>

      <div class="bg-white/80 backdrop-blur-md p-3.5 rounded-2xl shadow-sm border border-white/60 hover:shadow-md transition">
        <div class="flex items-center gap-1.5 mb-1">
          <span class="text-xs">💸</span>
          <p class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Keluar</p>
        </div>
        <p id="totalKeluar" class="text-base font-black text-rose-600">Rp 0</p>
      </div>

      <div class="col-span-2 bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 rounded-2xl shadow-lg border border-blue-400/30 text-center relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
        <p class="text-xs text-blue-100 font-medium tracking-wide mb-0.5">SISA SALDO KAS BEM</p>
        <p id="sisaSaldo" class="text-2xl font-black tracking-tight">Rp 0</p>
      </div>
    </section>

    <!-- Form Input Transaksi -->
    <section class="bg-white/85 backdrop-blur-md p-4.5 rounded-2xl shadow-sm border border-white/80 space-y-3.5">
      <div class="flex items-center gap-2 border-b border-gray-100 pb-2">
        <span class="text-base">✍️</span>
        <h2 class="text-xs font-black uppercase tracking-wider text-gray-700">Tambah Transaksi Baru</h2>
      </div>

      <form id="txForm" onsubmit="addTransaction(event)" class="space-y-3">
        
        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Jenis Transaksi</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnMasuk" onclick="setType('masuk')" class="py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-white bg-emerald-600 border-emerald-600 shadow-sm scale-105">
              <span>📥</span> Pemasukan (+)
            </button>
            <button type="button" id="btnKeluar" onclick="setType('keluar')" class="py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-gray-600 bg-gray-50 border-gray-200">
              <span>📤</span> Pengeluaran (-)
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Tanggal</label>
            <input type="date" id="txDate" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90 shadow-inner">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Nominal (Rp)</label>
            <input type="number" id="txAmount" min="1" placeholder="50000" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90 shadow-inner">
          </div>
        </div>

        <div>
          <label id="categoryLabel" class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Sumber Pemasukan</label>
          <input type="text" id="txCategory" placeholder="Contoh: Kas Anggota / Dana Dosen" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90 shadow-inner">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Catatan Tambahan (Opsional)</label>
          <input type="text" id="txNotes" placeholder="Contoh: Print proposal prokerja X" class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90 shadow-inner">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-black text-xs py-3 rounded-xl shadow-md hover:shadow-lg transition-all duration-150 flex items-center justify-center gap-1.5 mt-1">
          <span>💾</span> Simpan Transaksi
        </button>
      </form>
    </section>

    <!-- Riwayat Transaksi -->
    <section class="bg-white/85 backdrop-blur-md p-4.5 rounded-2xl shadow-sm border border-white/80">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-1.5">
          <span class="text-base">📜</span>
          <h2 class="text-xs font-black uppercase tracking-wider text-gray-700">Riwayat Transaksi LPJ</h2>
        </div>
        <span id="txCount" class="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full">0 data</span>
      </div>

      <div id="txList" class="space-y-3 max-h-96 overflow-y-auto pr-1">
        <p class="text-xs text-center text-gray-400 py-6">Belum ada catatan transaksi.</p>
      </div>
    </section>

  </main>

  <!-- Modal Pop-up Detail Transaksi (Animasi Bounce) -->
  <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden justify-center items-center p-4 z-50 transition-opacity duration-200">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 animate-modal border border-gray-100">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-lg">🔍</span>
          <h3 class="text-sm font-black text-gray-800">Detail Transaksi</h3>
        </div>
        <button onclick="closeModal()" class="w-7 h-7 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold text-sm active:scale-90 transition">&times;</button>
      </div>
      
      <div class="space-y-3 text-xs" id="modalContent">
        <!-- Detail diisi lewat Javascript -->
      </div>

      <button onclick="closeModal()" class="w-full bg-gray-900 hover:bg-black active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
        Tutup
      </button>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('bem_kas_data')) || [];
    let currentType = 'masuk';

    document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

    function setType(type) {
      currentType = type;
      const btnMasuk = document.getElementById('btnMasuk');
      const btnKeluar = document.getElementById('btnKeluar');
      const catLabel = document.getElementById('categoryLabel');
      const catInput = document.getElementById('txCategory');

      if (type === 'masuk') {
        btnMasuk.className = 'py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-white bg-emerald-600 border-emerald-600 shadow-sm scale-105';
        btnKeluar.className = 'py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-gray-600 bg-gray-50 border-gray-200';
        catLabel.textContent = 'Sumber Pemasukan';
        catInput.placeholder = 'Contoh: Kas Anggota / Dana Dosen';
      } else {
        btnKeluar.className = 'py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-white bg-rose-600 border-rose-600 shadow-sm scale-105';
        btnMasuk.className = 'py-2.5 text-xs font-bold rounded-xl border transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-gray-600 bg-gray-50 border-gray-200';
        catLabel.textContent = 'Peruntukan Pengeluaran';
        catInput.placeholder = 'Contoh: Konsumsi rapat / Cetak spanduk';
      }
    }

    function addTransaction(e) {
      e.preventDefault();
      const date = document.getElementById('txDate').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const category = document.getElementById('txCategory').value.trim();
      const notes = document.getElementById('txNotes').value.trim();

      const item = {
        id: Date.now(),
        date,
        type: currentType,
        amount,
        category,
        notes
      };

      transactions.unshift(item);
      saveAndRender();

      document.getElementById('txAmount').value = '';
      document.getElementById('txCategory').value = '';
      document.getElementById('txNotes').value = '';
    }

    function deleteTransaction(id) {
      if (confirm('Yakin ingin menghapus transaksi ini?')) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('bem_kas_data', JSON.stringify(transactions));
      renderList();
      renderSummary();
    }

    function formatRupiah(num) {
      return 'Rp ' + num.toLocaleString('id-ID');
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return new Date(dateStr).toLocaleDateString('id-ID', options);
    }

    function renderSummary() {
      const totalMasuk = transactions.filter(t => t.type === 'masuk').reduce((acc, t) => acc + t.amount, 0);
      const totalKeluar = transactions.filter(t => t.type === 'keluar').reduce((acc, t) => acc + t.amount, 0);
      const sisa = totalMasuk - totalKeluar;

      document.getElementById('totalMasuk').textContent = formatRupiah(totalMasuk);
      document.getElementById('totalKeluar').textContent = formatRupiah(totalKeluar);
      document.getElementById('sisaSaldo').textContent = formatRupiah(sisa);
      document.getElementById('txCount').textContent = `${transactions.length} data`;
    }

    function showDetail(id) {
      const t = transactions.find(item => item.id === id);
      if (!t) return;

      const modalContent = document.getElementById('modalContent');
      const isMasuk = t.type === 'masuk';

      modalContent.innerHTML = `
        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 space-y-2.5">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Jenis Transaksi</span>
            <span class="px-2.5 py-0.5 text-[10px] font-black rounded-full ${isMasuk ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              ${isMasuk ? '📥 PEMASUKAN' : '📤 PENGELUARAN'}
            </span>
          </div>

          <div>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Tanggal</span>
            <span class="font-bold text-gray-800">${formatDateIndo(t.date)} (${t.date})</span>
          </div>

          <div>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">${isMasuk ? 'Sumber Pemasukan' : 'Peruntukan Pengeluaran'}</span>
            <span class="font-extrabold text-gray-900 text-sm">${t.category}</span>
          </div>

          <div>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Nominal</span>
            <span class="text-base font-black ${isMasuk ? 'text-emerald-600' : 'text-rose-600'}">
              ${isMasuk ? '+' : '-'}${formatRupiah(t.amount)}
            </span>
          </div>

          <div class="border-t border-gray-200/60 pt-2">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Catatan Tambahan</span>
            <p class="text-gray-700 font-medium ${t.notes ? '' : 'italic text-gray-400'}">
              ${t.notes || 'Tidak ada catatan'}
            </p>
          </div>
        </div>
      `;

      const modal = document.getElementById('detailModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function renderList() {
      const container = document.getElementById('txList');
      if (transactions.length === 0) {
        container.innerHTML = '<p class="text-xs text-center text-gray-400 py-6">Belum ada catatan transaksi.</p>';
        return;
      }

      container.innerHTML = transactions.map(t => {
        const isMasuk = t.type === 'masuk';
        return `
          <div class="animate-card p-3.5 rounded-2xl border transition-all duration-200 hover:shadow-md ${isMasuk ? 'bg-emerald-50/80 border-emerald-200/80' : 'bg-rose-50/80 border-rose-200/80'} space-y-2">
            
            <!-- Header Kartu -->
            <div class="flex justify-between items-center border-b border-black/5 pb-1.5">
              <span class="text-[9px] font-black tracking-wider px-2 py-0.5 rounded-full ${isMasuk ? 'bg-emerald-200/80 text-emerald-900' : 'bg-rose-200/80 text-rose-900'}">
                ${isMasuk ? '📥 MASUK' : '📤 KELUAR'}
              </span>
              <span class="text-[10px] font-semibold text-gray-500">📅 ${formatDateIndo(t.date)}</span>
            </div>

            <!-- Konten Utama -->
            <div class="flex justify-between items-start gap-2">
              <div class="space-y-1">
                <div>
                  <span class="text-[9px] uppercase tracking-wider text-gray-400 font-extrabold block">
                    ${isMasuk ? 'Sumber:' : 'Peruntukan:'}
                  </span>
                  <p class="text-xs font-black text-gray-800 leading-snug">${t.category}</p>
                </div>

                <div>
                  <span class="text-[9px] uppercase tracking-wider text-gray-400 font-extrabold block">Catatan:</span>
                  <p class="text-[11px] text-gray-600 leading-snug ${t.notes ? '' : 'italic text-gray-400'}">
                    ${t.notes ? t.notes : 'Tidak ada catatan'}
                  </p>
                </div>
              </div>

              <!-- Nominal & Akses -->
              <div class="text-right shrink-0">
                <p class="text-xs font-black ${isMasuk ? 'text-emerald-700' : 'text-rose-700'}">
                  ${isMasuk ? '+' : '-'}${formatRupiah(t.amount)}
                </p>

                <div class="flex justify-end gap-2 mt-2">
                  <button onclick="showDetail(${t.id})" class="text-[10px] font-bold text-blue-600 hover:text-blue-800 active:scale-90 transition">
                    🔍 Detail
                  </button>
                  <span class="text-gray-300 text-[10px]">|</span>
                  <button onclick="deleteTransaction(${t.id})" class="text-[10px] font-bold text-rose-500 hover:text-rose-700 active:scale-90 transition">
                    🗑️ Hapus
                  </button>
                </div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function exportToExcel() {
      if (transactions.length === 0) {
        alert('Belum ada data transaksi untuk diekspor!');
        return;
      }

      const excelData = transactions.map((t, index) => ({
        'No': transactions.length - index,
        'Tanggal': t.date,
        'Tanggal Format': formatDateIndo(t.date),
        'Jenis Transaksi': t.type === 'masuk' ? 'Pemasukan' : 'Pengeluaran',
        'Sumber / Peruntukan': t.category,
        'Catatan': t.notes || '-',
        'Pemasukan (Rp)': t.type === 'masuk' ? t.amount : 0,
        'Pengeluaran (Rp)': t.type === 'keluar' ? t.amount : 0
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Kas BEM");

      XLSX.writeFile(workbook, `Laporan_Kas_BEM_Senapati_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    renderSummary();
    renderList();
  </script>
</body>
</html>
